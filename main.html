<!DOCTYPE html>
<html>
  <head>
    <title>Quiz with Session Storage</title>
    <style>
      /* Optional minimal styling for cleaner readability */
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }
      #questions > div {
        margin-bottom: 20px;
        padding: 10px;
        border-bottom: 1px solid #eee;
      }
      #submit {
        margin: 15px 0;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      #score {
        font-weight: bold;
        font-size: 18px;
        margin-top: 10px;
        color: #333;
      }
    </style>
  </head>

  <body>
    <h1>Quiz</h1>
    <div id="questions"></div>
    <button id="submit">Submit</button>
    <div id="score"></div>

    <script type="text/javascript">
      // Question Bank Array
      const questions = [
        {
          question: "What is the capital of France?",
          choices: ["Paris", "London", "Berlin", "Madrid"],
          answer: "Paris",
        },
        {
          question: "What is the highest mountain in the world?",
          choices: ["Everest", "Kilimanjaro", "Denali", "Matterhorn"],
          answer: "Everest",
        },
        {
          question: "What is the largest country by area?",
          choices: ["Russia", "China", "Canada", "United States"],
          answer: "Russia",
        },
        {
          question: "Which is the largest planet in our solar system?",
          choices: ["Earth", "Jupiter", "Mars"],
          answer: "Jupiter",
        },
        {
          question: "What is the capital of Canada?",
          choices: ["Toronto", "Montreal", "Vancouver", "Ottawa"],
          answer: "Ottawa",
        },
      ];

      // DOM Elements
      const questionsElement = document.getElementById("questions");
      const submitBtn = document.getElementById("submit");
      const scoreDisplay = document.getElementById("score");

      // --- 1. State Management (Session Storage Initialization) ---
      // Retrieve progress array from sessionStorage or initialize an empty array matching questions length
      let userAnswers = JSON.parse(sessionStorage.getItem("progress")) || new Array(questions.length).fill(null);

      // --- 2. Live Tracking Progress ---
      // Using event delegation to capture input choice changes instantly
      questionsElement.addEventListener("change", (e) => {
        if (e.target.matches("input[type='radio']")) {
          // Extract index number from the name string (e.g. "question-3" -> 3)
          const questionIndex = parseInt(e.target.name.split("-")[1]);
          const selectedValue = e.target.value;

          // Save tracking values internally and push directly to sessionStorage
          userAnswers[questionIndex] = selectedValue;
          sessionStorage.setItem("progress", JSON.stringify(userAnswers));
        }
      });

      // --- 3. Evaluate Quiz & Handle Local Storage ---
      submitBtn.addEventListener("click", () => {
        let score = 0;

        // Loop through answer array to evaluate selections
        questions.forEach((q, index) => {
          if (userAnswers[index] === q.answer) {
            score++;
          }
        });

        // Display evaluation message layout
        scoreDisplay.textContent = `Your score is ${score} out of 5.`;

        // Save score result token into localStorage
        localStorage.setItem("score", score);
      });

      // --- 4. Render Layout Routine ---
      function renderQuestions() {
        // Clear past content loops safely
        questionsElement.innerHTML = "";

        for (let i = 0; i < questions.length; i++) {
          const question = questions[i];
          const questionElement = document.createElement("div");
          const questionText = document.createTextNode(question.question);
          questionElement.appendChild(questionText);
          
          // Structural visual break line
          questionElement.appendChild(document.createElement("br"));

          for (let j = 0; j < question.choices.length; j++) {
            const choice = question.choices[j];
            const choiceElement = document.createElement("input");
            choiceElement.setAttribute("type", "radio");
            choiceElement.setAttribute("name", `question-${i}`);
            choiceElement.setAttribute("value", choice);
            
            // Check state checking condition based on stored data configurations
            if (userAnswers[i] === choice) {
              choiceElement.checked = true;
            }
            
            const choiceText = document.createTextNode(choice);
            questionElement.appendChild(choiceElement);
            questionElement.appendChild(choiceText);
          }
          // Fixed the assignment's boilerplate typo targeting container target variable
          questionsElement.appendChild(questionElement);
        }
      }

      // --- 5. Application Core Startup ---
      renderQuestions();

      // Ensure historical score evaluation values persist visual tracking if present on reload
      const historicalScore = localStorage.getItem("score");
      if (historicalScore !== null) {
        scoreDisplay.textContent = `Your score is ${historicalScore} out of 5.`;
      }
    </script>
  </body>
</html>
